<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traventure</title>
    <link rel="stylesheet" href="scheduleform.css" />
    <link rel="stylesheet" href="../Navbar/navbar.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav id="navbar-placeholder"></nav>

    <div class="main-wrapper">
      <!-- Left Background Image -->
      <div class="left-image"></div>

      <!-- Right Form Section -->
      <div class="form-container">
        <div class="form-box">
          <h2>Search Train Schedule</h2>

          <div class="search-method station-search">
            <h3>Search by Stations</h3>
            <label for="start-station">Start Station:</label>
            <select id="start-station">
              <option>--Select--</option>
            </select>

            <label for="end-station">End Station:</label>
            <select id="end-station">
              <option>--Select--</option>
            </select>

            <label for="search-date">Search Date:</label>
            <input type="date" id="search-date" value="2024-11-24" />
          </div>

          <div class="search-divider"><span>OR</span></div>

          <div class="search-method name-search">
            <h3>Search by Train Name</h3>
            <label for="train-name">Train Name:</label>
            <input
              type="text"
              id="train-name"
              placeholder="Ex:- Samudra Devi"
            />
          </div>

          <button type="button" id="search-button">Search</button>
        </div>
      </div>
    </div>

    <script src="scheduleForm.js"></script>
    <script src="../Navbar/navbar.js"></script>
    <script>
      function loadNavbar() {
        fetch("../Navbar/navbar.php")
          .then((res) => res.text())
          .then((data) => {
            document.getElementById("navbar-placeholder").innerHTML = data;
            document
              .getElementById("menu-toggle")
              .addEventListener("click", () => {
                const navMenu = document.getElementById("nav-menu");
                navMenu.classList.toggle("active");
              });
            updateNavbarState(false);
          });
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadNavbar();
      });

      function updateNavbarState(isLoggedIn) {
        document
          .getElementById("login-link")
          .classList.toggle("hidden", isLoggedIn);
        document
          .getElementById("user-icon")
          .classList.toggle("hidden", !isLoggedIn);
      }
    </script>
  </body>
</html>
