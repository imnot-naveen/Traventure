<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traventure</title>
    <link rel="stylesheet" href="scheduleform.css" />
    <link rel="stylesheet" href="../Navbar/navbar.css" />
  </head>
  <body>
    <!-- Navbar component -->
    <nav id="navbar-placeholder"></nav>

    <div class="container">
      <div class="form-box">
        <h2>Search Train Schedule</h2>

        <!-- Station-based search -->
        <div class="search-method station-search">
          <h3>Search by Stations</h3>
          <label for="start-station">Start Station:</label>
          <select id="start-station">
            <option>--Select--</option>
          </select>

          <label for="end-station">End Station:</label>
          <select id="end-station">
            <option>--Select--</option>
          </select>

          <label for="search-date">Search Date:</label>
          <input type="date" id="search-date" value="2024-11-24" />
        </div>

        <!-- Divider -->
        <div class="search-divider">
          <span>OR</span>
        </div>

        <!-- Train name search -->
        <div class="search-method name-search">
          <h3>Search by Train Name</h3>
          <label for="train-name">Train Name:</label>
          <input type="text" id="train-name" placeholder="Ex:- Samudra Devi" />
        </div>

        <!-- Common search button for both methods -->
        <button type="button" id="search-button">Search</button>
      </div>
    </div>

    <script src="scheduleForm.js"></script>
    <script src="../Navbar/navbar.js"></script>
    <script>
      // Function to load the Navbar
      function loadNavbar() {
        fetch("../Navbar/navbar.php")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("navbar-placeholder").innerHTML = data;
            // Initialize the navbar functionalities
            document
              .getElementById("menu-toggle")
              .addEventListener("click", function () {
                const navMenu = document.getElementById("nav-menu");
                navMenu.classList.toggle("active");
              });

            // Set the initial state
            updateNavbarState(false); // Set initial state (false means not logged in)
          });
      }

      document.addEventListener("DOMContentLoaded", function () {
        loadNavbar();
        loadFooter();
      });

      // Handle login state (optional)
      function handleLogin(event) {
        event.preventDefault();
        // Simulate login action
        updateNavbarState(true); // Set state to logged in
      }

      function handleLogout(event) {
        event.preventDefault();
        // Simulate logout action
        updateNavbarState(false); // Set state to logged out
      }

      function updateNavbarState(isLoggedIn) {
        if (isLoggedIn) {
          document.getElementById("login-link").classList.add("hidden");
          document.getElementById("user-icon").classList.remove("hidden");
        } else {
          document.getElementById("login-link").classList.remove("hidden");
          document.getElementById("user-icon").classList.add("hidden");
        }
      }
    </script>
  </body>
</html>
