<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Trains</title>
    <link rel="stylesheet" href="addtrains.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Traventure Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">About us</a></li>
                <li class="profile"><a href="#"><img class="user-icon" src="user-icon.png" alt="User icon"> R</a></li>
            </ul>
        </nav>
    </header>

    <div class="form-container">
        <h2>Add Trains</h2>
        <form>
            <div class="form-group">
                <label for="from">From:</label>
                <select id="from" name="from">
                    <option value="" disabled selected>Select Start Station</option>
                </select>
            </div>
            <div class="form-group">
                <label for="to">To:</label>
                <select id="to" name="to">
                    <option value="" disabled selected>Select End Station</option>
                </select>
            </div>
            <div class="form-group">
                <label for="trainType">Train Type:</label>
                <select id="trainType" name="trainType">
                    <option value="" disabled selected>Select Train Type</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date">
            </div>
            <div class="form-group">
                <label for="trainNo">Train No:</label>
                <input type="text" id="trainNo" name="trainNo">
            </div>
            <div class="form-group">
                <label for="departureTime">Departure Time:</label>
                <input type="time" id="departureTime" name="departureTime">
            </div>
            <div class="form-group">
                <label for="arrivalTime">Arrival Time:</label>
                <input type="time" id="arrivalTime" name="arrivalTime">
            </div>
            <div class="form-group">
                <label for="stops">Train Stops:</label>
                <div id="stops">
                    <p>Please select "From" and "To" stations to display stops.</p>
                </div>
            </div>
            <button type="submit" class="btn">Add</button>
        </form>
    </div>

    <script src="addtrains.js"></script>
</body>
</html>
