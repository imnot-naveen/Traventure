<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traventure - Activities</title>
    <link rel="stylesheet" href="activities.css" />
    <link rel="stylesheet" href="../Navbar/navbar.css" />
    <link rel="stylesheet" href="../Footer/footer.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <nav id="navbar-placeholder"></nav>
    <main>
      <section>
        <div class="heading">Discover Amazing Activities</div>

        <div class="search-container">
          <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input
              type="text"
              name="text"
              id="searchCity"
              placeholder="Search by city..."
            />
            <button id="searchBtn" class="btn">Search</button>
          </div>
        </div>

        <div class="posts-wrapper">
          <div class="post-card-container">
            <!-- Posts will be loaded here dynamically -->
          </div>
        </div>
      </section>
    </main>
    <footer id="footer"></footer>

    <script src="../Navbar/navbar.js"></script>
    <script src="activities.js"></script>
    <script src="../Footer/footer.js"></script>
    <script>
      // Function to load the Navbar
      function loadNavbar() {
        fetch("../Navbar/navbar.php")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("navbar-placeholder").innerHTML = data;
            // Initialize the navbar functionalities
            document
              .getElementById("menu-toggle")
              .addEventListener("click", function () {
                const navMenu = document.getElementById("nav-menu");
                navMenu.classList.toggle("active");
              });

            // Set the initial state
            updateNavbarState(false); // Set initial state (false means not logged in)
          });
      }

      // Function to load the Footer
      function loadFooter() {
        fetch("../Footer/footer.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("footer").innerHTML = data;
          });
      }

      document.addEventListener("DOMContentLoaded", function () {
        loadNavbar();
        loadFooter();
        fetchPosts(); // Load posts when page loads
      });

      // Handle login state (optional)
      function handleLogin(event) {
        event.preventDefault();
        // Simulate login action
        updateNavbarState(true); // Set state to logged in
      }

      function handleLogout(event) {
        event.preventDefault();
        // Simulate logout action
        updateNavbarState(false); // Set state to logged out
      }

      function updateNavbarState(isLoggedIn) {
        if (isLoggedIn) {
          document.getElementById("login-link").classList.add("hidden");
          document.getElementById("user-icon").classList.remove("hidden");
        } else {
          document.getElementById("login-link").classList.remove("hidden");
          document.getElementById("user-icon").classList.add("hidden");
        }
      }
    </script>

    <a
      href="https://www.facebook.com/sharer/sharer.php?u=https://yourwebsite.com"
      target="_blank"
    >
      Share on Facebook
    </a>
  </body>
</html>
