<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Gateway</title>
</head>
<body>
  <h1>PayHere Payment Gateway</h1>
  <form method="post" action="https://sandbox.payhere.lk/pay/checkout" id="paymentForm">
    <!-- Merchant Details -->
    <input type="hidden" name="merchant_id" value="121XXXX"> <!-- Replace with your Merchant ID -->
    <input type="hidden" name="return_url" value="http://localhost/return">
    <input type="hidden" name="cancel_url" value="http://localhost/cancel">
    <input type="hidden" name="notify_url" value="http://localhost/notify">

    <!-- Order Details -->
    <label for="order_id">Order ID:</label>
    <input type="text" id="order_id" name="order_id" value="12345" readonly><br><br>

    <label for="items">Items:</label>
    <input type="text" id="items" name="items" value="Test Product" readonly><br><br>

    <label for="currency">Currency:</label>
    <input type="text" id="currency" name="currency" value="LKR" readonly><br><br>

    <label for="amount">Amount:</label>
    <input type="number" id="amount" name="amount" value="1000" readonly><br><br>

    <!-- Customer Details -->
    <label for="first_name">First Name:</label>
    <input type="text" id="first_name" name="first_name" value="John"><br><br>

    <label for="last_name">Last Name:</label>
    <input type="text" id="last_name" name="last_name" value="Doe"><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="johndoe@example.com"><br><br>

    <label for="phone">Phone:</label>
    <input type="text" id="phone" name="phone" value="0771234567"><br><br>

    <label for="address">Address:</label>
    <input type="text" id="address" name="address" value="No. 1, Galle Road"><br><br>

    <label for="city">City:</label>
    <input type="text" id="city" name="city" value="Colombo"><br><br>

    <input type="hidden" name="country" value="Sri Lanka">

    <!-- Submit Button -->
    <button type="submit">Pay Now</button>
  </form>
</body>
</html>
