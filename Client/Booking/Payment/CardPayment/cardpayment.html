<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Payment</title>
    <script type="text/javascript" src="https://www.payhere.lk/lib/payhere.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 40px;
            text-align: center;
        }

        .card-container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        h1 {
            color: #11134F;
        }

        .info {
            margin-top: 20px;
            font-size: 1.1rem;
        }

        .btn-pay {
            margin-top: 30px;
            background-color: #11134F;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-pay:hover {
            background-color: #2c2f80;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <h1>Card Payment</h1>
        <div class="info">
            <p>Processing your payment securely with PayHere...</p>
        </div>
        <button class="btn-pay" id="pay-now-btn">Pay Now</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const bookingDetails = JSON.parse(localStorage.getItem("bookingDetails"));
            if (!bookingDetails) {
                alert("No booking details found.");
                return;
            }

            const {
                selectedTrain,
                fromStationId,
                toStationId,
                passengerCount,
                selectedClass,
                paymentOption,
                totalAmount
            } = bookingDetails;

            // Dummy user info (can be replaced with real user data if logged in)
            const user = {
                firstName: "Test",
                lastName: "User",
                email: "testuser@mail.com",
                phone: "0771234567"
            };

            const bookingId = `BOOK_${Date.now()}`;

            payhere.onCompleted = function onCompleted(orderId) {
                console.log("Payment completed. OrderID:", orderId);
                sendToBackend("success", orderId);
            };

            payhere.onDismissed = function onDismissed() {
                console.log("Payment dismissed");
                sendToBackend("cancelled", null);
            };

            payhere.onError = function onError(error) {
                console.log("Payment error:", error);
                sendToBackend("failed", null);
            };

            function sendToBackend(status, transactionId) {
                fetch("http://localhost/Traventure/Server/api/payment_handler.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        booking_id: bookingId,
                        amount: totalAmount,
                        payment_method: "card",
                        status: status,
                        transaction_id: transactionId || "N/A",
                        qr_code: ""
                    })
                })
                .then(res => res.json())
                .then(data => {
                    console.log("Response from backend:", data);
                    alert("Booking completed!");
                    window.location.href = "../../Confirmation/Confirm.html"; 
                })
                .catch(err => {
                    console.error("Error saving payment:", err);
                    alert("Payment save failed.");
                });
            }

            document.getElementById("pay-now-btn").addEventListener("click", () => {
                const payment = {
                    sandbox: true,
                    merchant_id: "1230057", 
                    return_url: "http://localhost/success.html",
                    cancel_url: "http://localhost/cancel.html",
                    notify_url: "http://localhost/notify.php",

                    order_id: bookingId,
                    items: "Train Ticket Booking",
                    amount: totalAmount,
                    currency: "LKR",
                    first_name: user.firstName,
                    last_name: user.lastName,
                    email: user.email,
                    phone: user.phone,
                    address: "Colombo",
                    city: "Colombo",
                    country: "Sri Lanka",
                };

                payhere.startPayment(payment);
            });
        });
    </script>
</body>
</html>
