<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../Navbar/navbar.css">
  <link rel="stylesheet" href="../../Footer/footer.css">
  <link rel="stylesheet" href="Reservation.css">
  <title>Reservation Page</title>
</head>
<body>
  <!-- Navbar component -->
  <nav id="navbar-placeholder"></nav>
  <div class="booking-container">
    <h1>Train Ticket Booking</h1>
    <form id="booking-form">
      <label for="num-tickets">Number of Tickets</label>
      <input type="number" id="num-tickets" min="1" required>

      <button type="button" id="generate-passenger-btn">Generate Passenger Inputs</button>

      <div id="passenger-details-container"></div>

      <button type="button" id="book-ticket-btn" >Book Ticket</button>
    </form>
    <div id="booking-summary" class="hidden">
      <h2>Booking Summary</h2>
      <p id="summary-details"></p>
      <p>Total Fare: <span id="total-fare"></span></p>
    </div>
  </div>
  

  </div>
  <!-- Footer HTML -->
  <footer id="footer"></footer>

  <script src="../Navbar/navbar.js"></script>
  <script src="home.js"></script>
  <script src="ticket_booking.js"></script>
  <script>
    // Function to load the Navbar
    function loadNavbar() {
      fetch('../../Navbar/navbar.php')
        .then(response => response.text())
        .then(data => {
          document.getElementById('navbar-placeholder').innerHTML = data;
          // Initialize the navbar functionalities
          document.getElementById('menu-toggle').addEventListener('click', function() {
            const navMenu = document.getElementById('nav-menu');
            navMenu.classList.toggle('active');
          });

          // Set the initial state
          updateNavbarState(false); // Set initial state (false means not logged in)
        });
    }

    // Function to load the Footer
    function loadFooter() {
      fetch('../../Footer/footer.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('footer').innerHTML = data;
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadNavbar();
      loadFooter();
    });

    // Handle login state (optional)
    function handleLogin(event) {
      event.preventDefault();
      // Simulate login action
      updateNavbarState(true); // Set state to logged in
    }

    function handleLogout(event) {
      event.preventDefault();
      // Simulate logout action
      updateNavbarState(false); // Set state to logged out
    }

    function updateNavbarState(isLoggedIn) {
      if (isLoggedIn) {
        document.getElementById('login-link').classList.add('hidden');
        document.getElementById('user-icon').classList.remove('hidden');
      } else {
        document.getElementById('login-link').classList.remove('hidden');
        document.getElementById('user-icon').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
