<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <link rel="stylesheet" href="booking_form.css">
</head>
<body>
    <div class="container">
        <h2>Book Your Trip</h2>
        <form id="bookingForm">
            <label for="no_of_passengers">Number of Passengers:</label>
            <input type="number" id="no_of_passengers" name="no_of_passengers" required min="1">

            <label for="payment_method">Payment Method:</label>
            <select id="payment_method" name="payment_method" required>
                <option value="card">Card</option>
                <option value="cash">Cash</option>
            </select>

            <button type="submit">Submit</button>
        </form>
        <div id="response"></div>
    </div>

    <script src="booking_form.js"></script>
</body>
</html>
