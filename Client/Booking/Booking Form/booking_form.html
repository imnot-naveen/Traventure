<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    .booking-form {
      max-width: 400px;
      margin: 50px auto;
      background: #ffffff;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    .booking-form h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #11134F;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #11134F;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background-color: #11134F;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #0d103d;
    }
    .error-message {
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="booking-form">
    <h2>Booking Form</h2>
    <form id="bookingForm">
      <div class="form-group">
        <label for="passengers">Number of Passengers</label>
        <input type="number" id="passengers" name="passengers" min="1" required>
        <span class="error-message" id="passengersError"></span>
      </div>
      <div class="form-group">
        <label for="paymentMethod">Payment Method</label>
        <select id="paymentMethod" name="paymentMethod" required>
          <option value="">Select a payment method</option>
          <option value="credit_card">Card</option>
          <option value="cash">Cash</option>
        </select>
        <span class="error-message" id="paymentMethodError"></span>
      </div>
      <div class="form-group">
        <label for="paymentStatus">Payment Status</label>
        <select id="paymentStatus" name="paymentStatus" required>
          <option value="">Select payment status</option>
          <option value="paid">Paid</option>
          <option value="pending">Pending</option>
        </select>
        <span class="error-message" id="paymentStatusError"></span>
      </div>
      <button type="submit" class="btn">Submit Booking</button>
    </form>
  </div>

  <script src="booking_form.js"></script>
</body>
</html>
