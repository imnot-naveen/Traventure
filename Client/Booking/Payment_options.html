<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traventure - Payment Options</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        .container { max-width: 700px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; color: #333; }
        .option { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; cursor: pointer; }
        .option:hover { background: #eaeaea; }
        .btn { display: block; width: 100%; padding: 10px; background: #007bff; color: #fff; text-align: center; text-decoration: none; border-radius: 5px; margin-top: 20px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select Payment Method</h1>
        <div class="option">Credit/Debit Card</div>
        <div class="option">Mobile Wallet</div>
        <div class="option">Bank Transfer</div>
        <div class="option">Cash on Delivery</div>
        <a href="Payment_gateway.html" class="btn">Continue</a>
    </div>
</body>
</html>
