<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Schedule with Selection</title>
    <link rel="stylesheet" href="selectTrain.css">
</head>
<body>
    <h1>Select Your Train</h1>
    <table>
        <thead>
            <tr>
                <th>Departure</th>
                <th>Arrival</th>
                <th>Duration</th>

                <th>Train No</th>

            </tr>
        </thead>
        <tbody id="train-results">
            <!-- Train rows with select options will be added here -->
        </tbody>
    </table>

    <script src="selectTrain.js"></script>

</html>
