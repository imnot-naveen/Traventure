<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="ContactUs.css" />
  </head>
  <body>
    <div class="contact-container">
      <div class="contact-details">
        <div class="contact-elements">
          <h3>Contact Us</h3>
          <p class="description">
            Feel free to use the form or drop us an email. Old fashioned phone
            calls work too.
          </p>
          <p><i class="fas fa-phone"></i>+123 456 789</p>
          <p><i class="fas fa-envelope"></i>traventurecorp@gmail.com</p>
          <p>
            <i class="fas fa-map-marker-alt"></i>123 Travel Lane, City, Country
          </p>
        </div>
      </div>
      <div class="contact-form">
        <div class="form-container">
          <form id="contact-us">
            <label for="fName">Name </label>
            <div class="nameInput">
              <div class="firstName">
                <input type="text" id="fName" placeholder="First" />
              </div>
              <div class="lastName">
                <input type="text" id="lName" placeholder="Last" />
              </div>
            </div>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="ex:- example@gmail.com"
            />
            <div id="emailError" class="error"></div>
            <label for="phone">Phone Number</label>
            <div id="phoneError" class="error"></div>
            <input type="text" id="phone" placeholder="ex:- 0771234567" />
            <label for="message">Message</label>
            <textarea id="message"></textarea>
            <button type="submit" class="submit-button">Submit</button>
          </form>
        </div>
      </div>
    </div>
    <script src="ContactUs.js"></script>
  </body>
</html>
