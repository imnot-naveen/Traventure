<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Error Page</title>
    <style>
        /* Resetting default margin and padding */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            height: 100%;
            overflow: hidden;
        }

        /* Full-page container */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
        }

        /* 404 Text Styling */
        .error-title {
            font-size: 120px;
            font-weight: bold;
            margin: 0;
        }

        .error-message {
            font-size: 24px;
            margin: 10px 0 20px;
        }

        /* Animated cloud illustration */
        .cloud {
            position: relative;
            width: 200px;
            height: 120px;
            background: #fff;
            border-radius: 50%;
            box-shadow: -20px -20px 0 -10px #fff, 20px -20px 0 -10px #fff;
            animation: float 3s ease-in-out infinite;
        }

        .cloud:after {
            content: '';
            position: absolute;
            width: 100px;
            height: 50px;
            background: #fff;
            border-radius: 50%;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Back to home button */
        .back-home {
            text-decoration: none;
            color: #1e3c72;
            background: #fff;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .back-home:hover {
            background: #f8f9fa;
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }

        /* Make it responsive */
        @media (max-width: 768px) {
            .error-title {
                font-size: 80px;
            }

            .error-message {
                font-size: 20px;
            }

            .cloud {
                width: 150px;
                height: 90px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cloud"></div>
        <h1 class="error-title">404</h1>
        <p class="error-message">Oops! The page you're looking for doesn't exist.</p>
        <a href="/" class="back-home">Back to Home</a>
    </div>
</body>
</html>
