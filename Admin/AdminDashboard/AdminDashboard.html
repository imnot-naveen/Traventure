<!DOCTYPE html>

            <div class="sidebar">
                <a href="#">
                    <span class="material-symbols-outlined">

                <a href="#">
                    <span class="material-symbols-outlined">

                <a href="#">
                    <span class="material-symbols-outlined">

                <a href="#">
                    <span class="material-symbols-outlined">

                    </span>

                <a href="#">
                    <span class="material-symbols-outlined">
                        shield_person
                    </span>

                    <span class="material-symbols-outlined">
                        shield_person
                    </span>
                    <h3>Content Writer</h3>
                </a>
                <a href="#">
                    <span class="material-symbols-outlined">
                        monitoring
                    </span>
                    <h3>Analytics</h3>
                </a>
                <a href="#">
                    <span class="material-symbols-outlined">
                        report
                    </span>
                    <h3>Reports</h3>
                </a>
                <a href="#">
                    <span class="material-symbols-outlined">
                        logout
                    </span>

        </aside>

    <script src="AdminDashboard.js"></script>

</html>
